<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RNS Reach Forge — OG image</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Schibsted+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F7F2; --ink: #102145; --ink-2: #475270; --line: #E1E4DA;
    --lime: #E5F8B0; --lime-strong: #B8E35C;
    --font: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--font);
    -webkit-font-smoothing: antialiased; position: relative;
  }
  .card { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; }
  .logo { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 34px; letter-spacing: -0.03em; }
  .logo-mark { width: 36px; height: 36px; border-radius: 8px; background: var(--ink); position: relative; flex: none; }
  .logo-mark::after {
    content: ""; position: absolute; right: -7px; bottom: -7px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--lime-strong); border: 4px solid var(--paper);
  }
  .eyebrow { display: flex; gap: 10px; margin-top: 54px; font: 500 17px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; }
  .eyebrow span { background: var(--lime); padding: 10px 16px; border-radius: 999px; }
  h1 { margin-top: 26px; font-size: 66px; line-height: 1.08; font-weight: 800; letter-spacing: -0.035em; max-width: 900px; }
  h1 em { font-style: normal; background: var(--lime); padding: 0 .12em; border-radius: 10px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
  .btn { background: var(--ink); color: #fff; font-weight: 600; font-size: 24px; padding: 20px 34px; border-radius: 999px; }
  .url { font: 500 22px var(--mono); color: var(--ink-2); }
  .ring {
    position: absolute; right: -150px; top: -150px; width: 460px; height: 460px; border-radius: 50%;
    background: var(--lime-strong); opacity: .9;
  }
  .ring::after { content: ""; position: absolute; inset: 90px; border-radius: 50%; background: var(--paper); }
</style>
</head>
<body>
  <div class="ring"></div>
  <div class="card">
    <div class="logo"><span class="logo-mark"></span>RNS Reach Forge</div>
    <p class="eyebrow"><span>B2B lead generation</span><span>Sales development</span><span>Email marketing</span></p>
    <h1>We fill your calendar with meetings with <em>the right buyers.</em></h1>
    <div class="foot">
      <span class="btn">Book a free consultation →</span>
      <span class="url">rnsreachforge.com</span>
    </div>
  </div>
</body>
</html>
